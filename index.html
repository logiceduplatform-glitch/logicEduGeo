    "@context": "https://schema.org",

    "name": "GeoLo Platform",
    "url": "https://geoloplatform.com",
    "description": "Train your brain with logic! 350+ educational games for kids 2-12 & adults. Learn. Think. Solve.",

  }

<body>
  <div id='root'></div>
  <script type='module' src='/src/main.jsx'></script>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.startsWith('127.')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          if (reg.active) reg.active.postMessage('PRECACHE_GAMES');
          reg.addEventListener('updatefound', function() {
            var nw = reg.installing;
            if (nw) nw.addEventListener('statechange', function() {
              if (nw.state === 'activated') nw.postMessage('PRECACHE_GAMES');
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage('SKIP_WAITING');
                window.dispatchEvent(new CustomEvent('sw-update-available'));
              }
            });
          });
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__swReloading) {
              window.__swReloading = true;
              window.location.reload();
            }
          });
        }).catch(function() {});
      });
    } else if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  </script>
</body>
